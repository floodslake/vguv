name: ForkY Master Executor

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  run-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ACTION_TOKEN: ${{ secrets.ACTION_TOKEN }}
      TARGET_REPO1: "floodslake/ncp-live-finder"
      TARGET_REPO2: "floodslake/ncp-live-now"
      TARGET_REF1: "live"
      TARGET_REF2: "main"
    steps:
      - name: Install gh
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl jq
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update -y
          sudo apt-get install -y gh

      - name: Authenticate gh
        env:
          ACTION_TOKEN: ${{ secrets.ACTION_TOKEN }}
        run: |
          echo "$ACTION_TOKEN" | gh auth login --with-token

      - name: Run Timed Sequence (simple)
        env:
          TARGET_REPO1: ${{ env.TARGET_REPO1 }}
          TARGET_REPO2: ${{ env.TARGET_REPO2 }}
          TARGET_REF1: ${{ env.TARGET_REF1 }}
          TARGET_REF2: ${{ env.TARGET_REF2 }}
        run: |
          set -euo pipefail
          
          check_and_run() {
            local target_time="$1"
            local target_epoch=$(date -u -d "$target_time" +%s 2>/dev/null || date -u -j -f "%H:%M:%S" "$target_time" +%s)
            local current_epoch=$(date -u +%s)
            local diff=$(( target_epoch - current_epoch ))

            if [ $diff -gt 0 ]; then
              echo "Waiting $diff seconds until $target_time UTC..."
              sleep "$diff"
              return 0
            else
              local late_seconds=$(( diff * -1 ))
              if [ $late_seconds -le 1200 ]; then
                echo "Target time $target_time UTC passed $late_seconds seconds ago (<= 20 mins). Executing immediately!"
                return 0
              elif [ $late_seconds -gt 1800 ]; then
                echo "Target time $target_time UTC passed $late_seconds seconds ago (> 30 mins). Skipping batch."
                return 1
              else
                # Between 20 and 30 minutes late (optional buffer zone, treating as skip or execute based on your preference)
                echo "Target time $target_time UTC is $late_seconds seconds late (between 20-30m buffer). Skipping."
                return 1
              fi
            fi
          }
          
          sleep_until() {
            local target_time="$1"
            local target_epoch=$(date -u -d "$target_time" +%s 2>/dev/null || date -u -j -f "%H:%M:%S" "$target_time" +%s)
            local current_epoch=$(date -u +%s)
            local diff=$(( target_epoch - current_epoch ))

            if [ $diff -gt 0 ]; then
              echo "Waiting $diff seconds until $target_time UTC..."
              sleep "$diff"
            else
              echo "Target time $target_time UTC has already passed ($(($diff * -1))s ago). Executing immediately!"
            fi
          }
          
          trigger_workflow() {
            local repo="$1"
            local ref="$2"
            local workflow_file="$3"
            echo "Triggering $workflow_file on $repo at $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            gh api --method POST -H "Accept: application/vnd.github+json" \
              /repos/"$repo"/actions/workflows/"$workflow_file"/dispatches \
              -f ref="$ref"
            sleep 5
          }

          echo "Starting sequence at $(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          if check_and_run "10:50:00"; then
            trigger_workflow "$TARGET_REPO1" "$TARGET_REF1" "workflow.yml"
            trigger_workflow "$TARGET_REPO1" "$TARGET_REF1" "workflow_fc.yml"
            trigger_workflow "$TARGET_REPO1" "$TARGET_REF1" "workflow_s.yml"
          fi
          
          if check_and_run "11:30:00"; then
            # trigger_workflow "$TARGET_REPO1" "$TARGET_REF1" "workflow_fc.yml"
            # trigger_workflow "$TARGET_REPO1" "$TARGET_REF1" "workflow_s.yml"
            trigger_workflow "$TARGET_REPO2" "$TARGET_REF2" "workflow_live.yml"
          fi
          
          if check_and_run "11:50:00"; then
            trigger_workflow "$TARGET_REPO1" "$TARGET_REF1" "workflow.yml"
          fi
          
          if check_and_run "12:10:00"; then
            # trigger_workflow "$TARGET_REPO1" "$TARGET_REF1" "workflow_fc.yml"
            # trigger_workflow "$TARGET_REPO1" "$TARGET_REF1" "workflow_s.yml"
            trigger_workflow "$TARGET_REPO2" "$TARGET_REF2" "workflow_live.yml"
          fi
          
          if check_and_run "12:50:00"; then
            trigger_workflow "$TARGET_REPO1" "$TARGET_REF1" "workflow.yml"
            trigger_workflow "$TARGET_REPO1" "$TARGET_REF1" "workflow_fc.yml"
            trigger_workflow "$TARGET_REPO1" "$TARGET_REF1" "workflow_s.yml"
          fi
          
          if check_and_run "13:10:00"; then
            trigger_workflow "$TARGET_REPO1" "$TARGET_REF1" "workflow_fc.yml"
            trigger_workflow "$TARGET_REPO1" "$TARGET_REF1" "workflow_s.yml"
            trigger_workflow "$TARGET_REPO2" "$TARGET_REF2" "workflow_live.yml"
          fi
          
          if check_and_run "13:50:00"; then
            trigger_workflow "$TARGET_REPO1" "$TARGET_REF1" "workflow.yml"
            trigger_workflow "$TARGET_REPO1" "$TARGET_REF1" "workflow_fc.yml"
            trigger_workflow "$TARGET_REPO1" "$TARGET_REF1" "workflow_s.yml"
          fi
          
          if check_and_run "14:30:00"; then
            trigger_workflow "$TARGET_REPO1" "$TARGET_REF1" "workflow_fc.yml"
            trigger_workflow "$TARGET_REPO1" "$TARGET_REF1" "workflow_s.yml"
            trigger_workflow "$TARGET_REPO2" "$TARGET_REF2" "workflow_live.yml"
          fi
          
          echo "Sequence finished at $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
