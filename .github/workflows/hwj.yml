name: Hourly Window Job (Conditional Strict)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  pre_check:
    name: Pre Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check Time Window for Schedules Only
        run: |
          # If it IS a schedule event, enforce the 10:00 - 16:00 UTC window
          CURRENT_HOUR=$(date -u +%H)
          CURRENT_HOUR=$((10#$CURRENT_HOUR))
          echo "Current UTC Hour: $CURRENT_HOUR"
          date -u

          # If it's NOT a schedule event (e.g., manual trigger), bypass the check and continue
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "ℹ️ Triggered via '${{ github.event_name }}'. Bypassing time window check."
            exit 0
          fi
          
          if [ "$CURRENT_HOUR" -ge 10 ] && [ "$CURRENT_HOUR" -le 16 ]; then
            echo "✅ Within the 10:00 - 16:00 UTC window. Proceeding..."
            exit 0
          else
            echo "❌ ERROR: Scheduled run is outside the target window (10-16 UTC). Current hour is $CURRENT_HOUR."
            echo "Failing workflow due to GitHub Actions cron delay."
            exit 1
          fi  

  main:
    name: mains code
    needs: pre_check
    runs-on: ubuntu-latest
    steps:
      - name: Your Core Logic
        run: |
          echo "Event type: ${{ github.event_name }}"
          echo "Execution time (UTC):"
          date -u
